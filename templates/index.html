<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>StackAI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-box { width: 600px; height: 80vh; background: #16213e; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
        .baslik { padding: 20px; background: #0f3460; font-size: 20px; font-weight: bold; text-align: center; }
        .mesajlar { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .mesaj { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; }
        .kullanici { background: #0f3460; align-self: flex-end; }
        .bot { background: #e94560; align-self: flex-start; }
        .input-alani { display: flex; padding: 16px; gap: 10px; background: #0f3460; }
        input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #1a1a2e; color: white; font-size: 15px; outline: none; }
        button { padding: 12px 20px; background: #e94560; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 15px; }
        button:hover { background: #c73652; }
    </style>
</head>
<body>
    <div class="chat-box">
        <div class="baslik">🤖 StackAI</div>
        <div class="mesajlar" id="mesajlar"></div>
        <div class="input-alani">
            <input type="text" id="input" placeholder="Mesajını yaz..." />
            <button onclick="gonder()">Gönder</button>
        </div>
    </div>

    <script>
        const input = document.getElementById("input");
        const mesajlar = document.getElementById("mesajlar");

        input.addEventListener("keydown", e => { if (e.key === "Enter") gonder(); });

        async function gonder() {
            const mesaj = input.value.trim();
            if (!mesaj) return;
            input.value = "";

            ekle(mesaj, "kullanici");

            const res = await fetch("/mesaj", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mesaj })
            });

            const data = await res.json();
            ekle(data.yanit, "bot");
        }

        function ekle(metin, tip) {
            const div = document.createElement("div");
            div.className = `mesaj ${tip}`;
            div.textContent = metin;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        }
    </script>
</body>
</html>
